<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>

    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="text-white">
        <span class="font-weight-bold" sec:authentication="name"></span>
        <span> with roles: </span>
        <span th:each="a, st : ${#authentication.authorities}"
              class="font-weight-bold"
              th:text="${#strings.replace(a.authority,'ROLE_','') + (st.last ? '' : ' ')}"></span>
    </div>

    <form th:action="@{/logout}" method="post" class="mb-0">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button class="btn btn-link text-light" type="submit">Logout</button>
    </form>
</nav>

<div class="container-fluid">
    <div class="row">

        <div class="col-2 px-0 border-right" style="min-height: calc(100vh - 56px);">
            <div class="nav flex-column nav-pills">
                <a class="nav-link active rounded-0" href="#">Admin</a>
                <a class="nav-link rounded-0" th:href="@{/user}">User</a>
            </div>
        </div>

        <div class="col-10 bg-light" style="min-height: calc(100vh - 56px);">
            <div class="pt-3 px-3">
                <h1 class="mb-3">Admin panel</h1>

                <div class="card">
                    <div class="card-header">
                        <ul class="nav nav-tabs card-header-tabs" id="adminTabs" role="tablist">
                            <li class="nav-item">
                                <a class="nav-link active" id="users-tab" data-toggle="tab" href="#usersTable"
                                   role="tab">Users table</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" id="new-tab" data-toggle="tab" href="#newUser" role="tab">New User</a>
                            </li>
                        </ul>
                    </div>

                    <div class="card-body tab-content">

                        <div class="tab-pane fade show active" id="usersTable" role="tabpanel">
                            <h4 class="mb-3">All users</h4>

                            <table class="table table-striped">
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Age</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Edit</th>
                                    <th>Delete</th>
                                </tr>
                                </thead>

                                <tbody id="usersTbody">
                                </tbody>
                            </table>
                        </div>

                        <div class="tab-pane fade" id="newUser" role="tabpanel">
                            <h4 class="mb-3">Add new user</h4>

                            <div id="createErrors" class="text-danger mb-2"></div>

                            <form id="createForm" class="mx-auto" style="max-width: 360px;">
                                <div class="form-group text-center font-weight-bold">First name</div>
                                <input class="form-control mb-3" name="name" placeholder="">

                                <div class="form-group text-center font-weight-bold">Last name</div>
                                <input class="form-control mb-3" name="surname" placeholder="">

                                <div class="form-group text-center font-weight-bold">Age</div>
                                <input class="form-control mb-3" type="number" name="age" placeholder="">

                                <div class="form-group text-center font-weight-bold">Email</div>
                                <input class="form-control mb-3" name="username" placeholder="">

                                <div class="form-group text-center font-weight-bold">Password</div>
                                <input class="form-control mb-3" type="password" name="password" placeholder="">

                                <div class="form-group text-center font-weight-bold">Role</div>
                                <select class="form-control mb-4" id="createRoles" name="roleIds" multiple size="2">
                                    <!-- filled by JS -->
                                </select>

                                <button class="btn btn-success btn-block" type="submit">Add new user</button>
                            </form>
                        </div>

                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<div class="modal fade" tabindex="-1" id="editModal" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Edit user</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <form id="editForm">
                <div class="modal-body">
                    <div id="editErrors" class="text-danger mb-2"></div>

                    <div class="form-group text-center font-weight-bold">ID</div>
                    <input class="form-control mb-3" name="id" readonly>

                    <div class="form-group text-center font-weight-bold">First name</div>
                    <input class="form-control mb-3" name="name">

                    <div class="form-group text-center font-weight-bold">Last name</div>
                    <input class="form-control mb-3" name="surname">

                    <div class="form-group text-center font-weight-bold">Age</div>
                    <input class="form-control mb-3" type="number" name="age">

                    <div class="form-group text-center font-weight-bold">Email</div>
                    <input class="form-control mb-3" name="username">

                    <div class="form-group text-center font-weight-bold">Password</div>
                    <input class="form-control mb-3" type="password" name="password" placeholder="leave empty to keep">

                    <div class="form-group text-center font-weight-bold">Role</div>
                    <select class="form-control" id="editRoles" name="roleIds" multiple size="2">

                    </select>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Edit</button>
                </div>
            </form>

        </div>
    </div>
</div>

<div class="modal fade" tabindex="-1" id="deleteModal" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Delete user</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <form id="deleteForm">
                <div class="modal-body">
                    <div id="deleteErrors" class="text-danger mb-2"></div>

                    <div class="form-group text-center font-weight-bold">ID</div>
                    <input class="form-control mb-3" name="id" readonly>

                    <div class="form-group text-center font-weight-bold">First name</div>
                    <input class="form-control mb-3" name="name" readonly>

                    <div class="form-group text-center font-weight-bold">Last name</div>
                    <input class="form-control mb-3" name="surname" readonly>

                    <div class="form-group text-center font-weight-bold">Age</div>
                    <input class="form-control mb-3" name="age" readonly>

                    <div class="form-group text-center font-weight-bold">Email</div>
                    <input class="form-control mb-3" name="username" readonly>

                    <div class="form-group text-center font-weight-bold">Role</div>
                    <input class="form-control mb-3" name="roles" readonly>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="/js/admin.js"></script>
</body>
</html>
