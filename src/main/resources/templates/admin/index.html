<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>

    <!-- Bootstrap 4 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>

<!-- Top navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="text-white">
        <span class="font-weight-bold" sec:authentication="name"></span>
        <span> with roles: </span>
        <span th:each="a, st : ${#authentication.authorities}"
              class="font-weight-bold"
              th:text="${#strings.replace(a.authority,'ROLE_','') + (st.last ? '' : ' ')}"></span>
    </div>

    <form th:action="@{/logout}" method="post" class="mb-0">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button class="btn btn-link text-light" type="submit">Logout</button>
    </form>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- Left sidebar -->
        <div class="col-2 px-0 border-right" style="min-height: calc(100vh - 56px);">
            <div class="nav flex-column nav-pills">
                <a class="nav-link active rounded-0" href="#">Admin</a>
                <a class="nav-link rounded-0" th:href="@{/user}">User</a>
            </div>
        </div>

        <!-- Main -->
        <div class="col-10 bg-light" style="min-height: calc(100vh - 56px);">
            <div class="pt-3 px-3">
                <h1 class="mb-3">Admin panel</h1>

                <div class="card">
                    <div class="card-header">
                        <ul class="nav nav-tabs card-header-tabs" id="adminTabs" role="tablist">
                            <li class="nav-item">
                                <a class="nav-link active" id="users-tab" data-toggle="tab" href="#usersTable"
                                   role="tab">Users table</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" id="new-tab" data-toggle="tab" href="#newUser" role="tab">New
                                    User</a>
                            </li>
                        </ul>
                    </div>

                    <div class="card-body tab-content">

                        <!-- Users table tab -->
                        <div class="tab-pane fade show active" id="usersTable" role="tabpanel">
                            <h4 class="mb-3">All users</h4>

                            <table class="table table-striped">
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Age</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Edit</th>
                                    <th>Delete</th>
                                </tr>
                                </thead>

                                <tbody>
                                <tr th:each="u : ${users}">
                                    <td th:text="${u.id}"></td>
                                    <td th:text="${u.name}"></td>
                                    <td th:text="${u.surname}"></td>
                                    <td th:text="${u.age}"></td>
                                    <td th:text="${u.username}"></td>
                                    <td>
                    <span th:each="r, st : ${u.roles}"
                          th:text="${#strings.replace(r.name,'ROLE_','') + (st.last ? '' : ' ')}"></span>
                                    </td>

                                    <td>
                                        <button type="button"
                                                class="btn btn-info btn-sm"
                                                data-toggle="modal"
                                                th:attr="data-target='#editModal__' + ${u.id}">
                                            Edit
                                        </button>
                                    </td>

                                    <td>
                                        <button type="button"
                                                class="btn btn-danger btn-sm"
                                                data-toggle="modal"
                                                th:attr="data-target='#deleteModal__' + ${u.id}">
                                            Delete
                                        </button>
                                    </td>
                                </tr>
                                </tbody>
                            </table>

                            <!-- EDIT MODALS -->
                            <div th:each="u : ${users}">
                                <div class="modal fade" tabindex="-1"
                                     th:id="'editModal__' + ${u.id}"
                                     role="dialog" aria-hidden="true">
                                    <div class="modal-dialog modal-dialog-centered" role="document">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title">Edit user</h5>
                                                <button type="button" class="close" data-dismiss="modal"
                                                        aria-label="Close">
                                                    <span aria-hidden="true">&times;</span>
                                                </button>
                                            </div>

                                            <form th:action="@{/admin/update}" method="post">
                                                <input type="hidden" th:name="${_csrf.parameterName}"
                                                       th:value="${_csrf.token}"/>
                                                <div class="modal-body">

                                                    <div class="form-group text-center font-weight-bold">ID</div>
                                                    <input class="form-control mb-3" name="id" th:value="${u.id}"
                                                           readonly>

                                                    <div class="form-group text-center font-weight-bold">First name
                                                    </div>
                                                    <input class="form-control mb-3" name="name" th:value="${u.name}">

                                                    <div class="form-group text-center font-weight-bold">Last name</div>
                                                    <input class="form-control mb-3" name="surname"
                                                           th:value="${u.surname}">

                                                    <div class="form-group text-center font-weight-bold">Age</div>
                                                    <input class="form-control mb-3" type="number" name="age"
                                                           th:value="${u.age}">

                                                    <div class="form-group text-center font-weight-bold">Email</div>
                                                    <input class="form-control mb-3" name="username"
                                                           th:value="${u.username}">

                                                    <div class="form-group text-center font-weight-bold">Password</div>
                                                    <input class="form-control mb-3" type="password" name="password"
                                                           placeholder="">

                                                    <div class="form-group text-center font-weight-bold">Role</div>
                                                    <select class="form-control" name="roleIds" multiple size="2">
                                                        <option th:each="r : ${allRoles}"
                                                                th:value="${r.id}"
                                                                th:text="${#strings.replace(r.name,'ROLE_','')}"
                                                                th:selected="${u.roles.contains(r)}"></option>
                                                    </select>

                                                </div>

                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary"
                                                            data-dismiss="modal">Close
                                                    </button>
                                                    <button type="submit" class="btn btn-primary">Edit</button>
                                                </div>
                                            </form>

                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- DELETE MODALS -->
                            <div th:each="u : ${users}">
                                <div class="modal fade" tabindex="-1"
                                     th:id="'deleteModal__' + ${u.id}"
                                     role="dialog" aria-hidden="true">
                                    <div class="modal-dialog modal-dialog-centered" role="document">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title">Delete user</h5>
                                                <button type="button" class="close" data-dismiss="modal"
                                                        aria-label="Close">
                                                    <span aria-hidden="true">&times;</span>
                                                </button>
                                            </div>

                                            <form th:action="@{/admin/delete}" method="post">
                                                <input type="hidden" th:name="${_csrf.parameterName}"
                                                       th:value="${_csrf.token}"/>
                                                <div class="modal-body">

                                                    <div class="form-group text-center font-weight-bold">ID</div>
                                                    <input class="form-control mb-3" name="id" th:value="${u.id}"
                                                           readonly>

                                                    <div class="form-group text-center font-weight-bold">First name
                                                    </div>
                                                    <input class="form-control mb-3" th:value="${u.name}" readonly>

                                                    <div class="form-group text-center font-weight-bold">Last name</div>
                                                    <input class="form-control mb-3" th:value="${u.surname}" readonly>

                                                    <div class="form-group text-center font-weight-bold">Age</div>
                                                    <input class="form-control mb-3" th:value="${u.age}" readonly>

                                                    <div class="form-group text-center font-weight-bold">Email</div>
                                                    <input class="form-control mb-3" th:value="${u.username}" readonly>

                                                    <div class="form-group text-center font-weight-bold">Role</div>
                                                    <select class="form-control" multiple size="2" disabled>
                                                        <option th:each="r : ${u.roles}"
                                                                th:text="${#strings.replace(r.name,'ROLE_','')}"></option>
                                                    </select>

                                                </div>

                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary"
                                                            data-dismiss="modal">Close
                                                    </button>
                                                    <button type="submit" class="btn btn-danger">Delete</button>
                                                </div>
                                            </form>

                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>

                        <!-- New user tab -->
                        <div class="tab-pane fade" id="newUser" role="tabpanel">
                            <h4 class="mb-3">Add new user</h4>

                            <form th:action="@{/admin/create}" method="post" class="mx-auto" style="max-width: 360px;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                                <div class="form-group text-center font-weight-bold">First name</div>
                                <input class="form-control mb-3" name="name" placeholder="">

                                <div class="form-group text-center font-weight-bold">Last name</div>
                                <input class="form-control mb-3" name="surname" placeholder="">

                                <div class="form-group text-center font-weight-bold">Age</div>
                                <input class="form-control mb-3" type="number" name="age" placeholder="">

                                <div class="form-group text-center font-weight-bold">Email</div>
                                <input class="form-control mb-3" name="username" placeholder="">

                                <div class="form-group text-center font-weight-bold">Password</div>
                                <input class="form-control mb-3" type="password" name="password" placeholder="">

                                <div class="form-group text-center font-weight-bold">Role</div>
                                <select class="form-control mb-4" name="roleIds" multiple size="2">
                                    <option th:each="r : ${allRoles}"
                                            th:value="${r.id}"
                                            th:text="${#strings.replace(r.name,'ROLE_','')}"></option>
                                </select>

                                <button class="btn btn-success btn-block" type="submit">Add new user</button>
                            </form>
                        </div>

                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<!-- JS for Bootstrap 4 modals/tabs -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
